name: 发布 Windows Beta 测试版

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要发布的 Beta 分支、提交或标签"
        required: true
        default: "main"
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

concurrency:
  group: beta-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-tag:
    name: 创建 Beta 版本标签
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: 检出指定版本
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 验证版本并创建标签
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"

          if [ "$VERSION" != "$LOCK_VERSION" ] || [ "$VERSION" != "$TAURI_VERSION" ] || [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::package.json、package-lock.json、tauri.conf.json 与 Cargo.toml 的版本号不一致"
            exit 1
          fi
          case "$VERSION" in
            *-*) ;;
            *)
              echo "::error::Beta 版本号必须包含预发布标识，例如 0.7.0-beta.1"
              exit 1
              ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::标签 v$VERSION 已存在；Beta 构建不可覆盖，请提升预发布序号"
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "EazyLedger Beta v$VERSION"
          git push origin "v$VERSION"

  release:
    name: 验证、构建并发布 Beta
    needs: create-tag
    if: >-
      always() &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && needs.create-tag.result == 'success'))
    runs-on: windows-latest

    steps:
      - name: 检出 Beta 标签
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.create-tag.outputs.version) || github.ref }}
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译结果
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 验证 Beta 标签与版本
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lockVersion = (node -p "require('./package-lock.json').version").Trim()
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tagName = "v$packageVersion"

          if ($packageVersion -ne $lockVersion -or $packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "package.json、package-lock.json、tauri.conf.json 与 Cargo.toml 的版本号不一致。"
          }
          if (-not $packageVersion.Contains("-")) {
            throw "Beta 版本号必须包含预发布标识，例如 0.7.0-beta.1。"
          }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tagName) {
            throw "标签 ${{ github.ref_name }} 与项目版本 $tagName 不一致。"
          }

          "value=$packageVersion" >> $env:GITHUB_OUTPUT
          "tag=$tagName" >> $env:GITHUB_OUTPUT

      - name: 安装前端依赖
        run: npm ci

      - name: 验证前端
        run: npm run build

      - name: 验证 Tauri 后端
        working-directory: src-tauri
        run: cargo check

      - name: 构建安装包并创建 GitHub Pre-release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "EazyLedger Beta v__VERSION__"
          releaseBody: |
            EazyLedger Windows Beta 测试版，用于提前体验和快速反馈。

            测试版可能存在未发现的问题，安装前建议先在“设置”中创建完整备份。可直接运行 EXE 覆盖安装，也可在开启“接收测试版”后通过应用内更新安装。
          releaseDraft: false
          prerelease: true
          retryAttempts: 2
          updaterJsonPreferNsis: true

      - name: 生成 Beta 更新清单
        shell: pwsh
        run: |
          ./.github/scripts/publish-updater-manifest.ps1 `
            -Repository "${{ github.repository }}" `
            -Tag "${{ steps.version.outputs.tag }}" `
            -Token "${{ secrets.GITHUB_TOKEN }}" `
            -OutputPath "$env:RUNNER_TEMP/latest.json"

      - name: 将 Beta 更新清单同步到 beta-channel
        shell: pwsh
        run: |
          # Tauri 构建可能改写 Cargo.toml；发布清单前恢复临时构建变更。
          git restore --source=HEAD --staged --worktree -- .
          git fetch origin beta-channel 2>$null
          if ($LASTEXITCODE -eq 0) {
            git switch --force-create beta-channel origin/beta-channel
          } else {
            git switch --orphan beta-channel
            git rm -rf .
          }

          New-Item -ItemType Directory -Force update | Out-Null
          Copy-Item "$env:RUNNER_TEMP/latest.json" "update/latest.json" -Force
          git add -- update/latest.json
          $manifestChanges = git status --porcelain -- update/latest.json
          if ([string]::IsNullOrWhiteSpace($manifestChanges)) {
            "Beta 更新清单没有变化"
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish beta updater manifest for ${{ steps.version.outputs.tag }}"
          git push origin HEAD:refs/heads/beta-channel
