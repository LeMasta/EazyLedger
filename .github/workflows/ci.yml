name: PR 构建检查

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译结果
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 验证前端
        run: npm run build

      - name: 验证 Tauri 后端
        working-directory: src-tauri
        run: cargo check
